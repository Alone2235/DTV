name: Android Build

# 触发条件：
#   · push 到 main        → 编译 + 上传 APK 为 Artifact
#   · push tag v*         → 编译 + 自动创建 Release 并附上 APK
#   · 手动触发            → Actions 页面点 Run workflow
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # 发 Release 需要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 运行器自带 Android SDK（ANDROID_SDK_ROOT 已设置），
      # 不再使用 android-actions/setup-android（该 action 已不稳定，实测直接失败）。
      # 这里仅按需补装本项目需要的 platform / build-tools，并接受许可。
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "SDK=$SDK"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
          else
            echo "sdkmanager 未找到，使用运行器自带 SDK"
          fi
          ls "$SDK/platforms" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        # 不要加 --offline（CI 需要联网拉依赖）；
        # gradle.properties 里的 jvmargs 是给 647MB 老盒子的本地开发值，
        # CI 上放宽内存，避免 K2JVMCompiler native OOM。
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DTV-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Release (仅 tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
