name: Android Build

# 触发条件：
#   · push 到 main        → 编译电视端 + 手机端，产物上传为 Artifact
#   · push tag v*         → 额外自动创建 Release 并附上电视端 APK
#   · 手动触发            → Actions 页面点 Run workflow
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # 发 Release 需要写权限

jobs:
# ---------------- 设计守卫（防止 UI 风格退化） ----------------
  design-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run design guard
        shell: pwsh
        run: ./tools/design-guard.ps1

  # ---------------- 电视端（DTV） ----------------
  tv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK（ANDROID_SDK_ROOT 已设置）；
      # 不使用 android-actions/setup-android（该 action 已不稳定，实测直接失败）。
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "SDK=$SDK"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" || true

      # ★ 本仓库只有 gradlew.bat（Windows 生成），没有 Linux 的 gradlew 脚本，
      #   因此直接用 wrapper jar 启动 —— 跨平台且不依赖 shell 脚本。
      - name: Build TV release APK
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        run: |
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \
            :app:assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Upload TV release APK
        uses: actions/upload-artifact@v4
        with:
          name: DTV-TV-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish Release (仅 tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

  # ---------------- 手机遥控端（DtvRemote） ----------------
  remote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi

      - name: Build Remote debug APK
        working-directory: remote
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        run: |
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \
            :app:assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Upload Remote APK
        uses: actions/upload-artifact@v4
        with:
          name: DTV-Remote-release-apk
          path: remote/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
