# 内存收紧历史：-Xmx768m 曾反复触发 K2JVMCompiler native OOM（hs_err_pid* 十余份）。
# 82.x 实测：本机 10GB 但常驻程序（桌面/浏览器）占 ~9GB，可用常跌破 1.5GB。
#   768m 太小（编译必崩）、1024m 又挤压 native 空间（mmap 失败）。
#   2.04 取 896m；构建时尽量少开程序（尤其浏览器/微信/杀毒）。
org.gradle.jvmargs=-Xmx896m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process

# ---------------------------------------------------------------------------
# AndroidX 开关
# ---------------------------------------------------------------------------
# ★ 打开 AndroidX ★
#   依赖体系已切回 v11 的 ExoPlayer 2.18.1（它会传递依赖 androidx.core 等），
#   列表控件也换成了 androidx.recyclerview —— 本项目现在完全基于 AndroidX，
#   不再有任何 support 库，故必须 useAndroidX=true。
#   （当初之所以关掉它，是因为 support-v7 RecyclerView 与 2.18.1 的 androidx
#     传递依赖重复类冲突；现在 support 库已全部移除，冲突源头没了。）
#   Jetifier 保持关闭：全部依赖本来就是 androidx，无需把 support 转过去。
android.useAndroidX=true
android.enableJetifier=false

# 液态玻璃库 com.qmdeve.liquidglass:core:1.1.0 声明需要 compileSdk 37
# （AGP 8.9 上限 35）—— 跳过该检查：我们只用它的公开 API，不碰 37 专属接口
android.experimental.disableCompileSdkChecks=true

# ---------------------------------------------------------------------------
# 代理
# ---------------------------------------------------------------------------
# ★ 已注释：本机实测 127.0.0.1:7897 并未监听，Gradle 走它必报
#   "Connect to 127.0.0.1:7897 failed: Connection refused"。
#   当前依赖全部走阿里云镜像（见 settings.gradle），不需要代理。
#   如果你要开代理拉官方源，把下面四行取消注释即可。
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.*|192.168.*|10.*
